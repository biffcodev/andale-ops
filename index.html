<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>àndale Operaciones</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/Delight-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
<div id="app" class="app">
  <aside class="side" id="top" hidden>
    <div class="side-h">
      <div class="brand"><span class="logo" role="img" aria-label="àndale"></span> <small>Operaciones</small></div>
      <button class="btn ghost sm side-x" data-act="menu" aria-label="Cerrar menú">✕</button>
    </div>
    <button class="askbtn" id="askbtn" data-act="iaAbrir" title="Atajo: Ctrl + K" aria-label="Preguntale a Mr. Piggy" hidden><span class="askbtn-i" aria-hidden="true"></span><span class="askbtn-t"><b>Mr. Piggy</b></span></button>
    <nav class="snav" id="nav" aria-label="Secciones"></nav>
    <nav class="snav" id="nav2" aria-label="Administración" hidden></nav>
    <div class="side-f"><span id="me"></span><span id="sync" class="sync"><i></i><span>Conectando</span></span><button class="btn ghost sm" data-act="logout">Salir</button></div>
  </aside>
  <div class="main">
    <div class="mbar" id="mbar"><button class="btn ghost" data-act="menu" aria-label="Abrir menú"><span class="burger"></span></button><div class="brand"><span class="logo" role="img" aria-label="àndale"></span></div><button class="btn ghost sm askmini" data-act="iaAbrir" aria-label="Preguntale a Mr. Piggy" hidden></button><span id="hoy"></span></div>
    <div class="wrap">
      <div id="banner" class="banner" hidden></div>
      <main id="view"></main>
    </div>
  </div>
</div>
<div id="sidescrim" class="scrim side-scrim" data-act="menu" hidden></div>
<div id="scrim" class="scrim" data-act="close" hidden></div>
<aside id="panel" class="panel" hidden aria-modal="true" role="dialog" aria-labelledby="panel-title"></aside>
<div id="toast" class="toast" hidden></div>
<div class="ia-ov" id="ia" hidden><div class="ia-box" role="dialog" aria-modal="true" aria-labelledby="ia-t"></div></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
